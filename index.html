<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>개인정보 보호 교육 | QR 체험</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101827;color:#fff;font-family:system-ui,'Malgun Gothic',sans-serif;text-align:center;padding:24px}.wrap{width:min(100%,460px)}.symbol{font-size:64px;margin-bottom:16px}.eyebrow{font-size:14px;color:#fda4af;font-weight:700;letter-spacing:2px}h1{font-size:clamp(35px,9vw,52px);line-height:1.2;margin:16px 0;color:#fff}p{font-size:19px;line-height:1.7;margin:0 0 24px;color:#d9e1ec}.line{height:1px;background:#354155;margin:28px 0}.key{font-size:clamp(24px,7vw,34px);font-weight:800;color:#67e8f9}.small{font-size:13px;color:#9baabd;margin-top:30px;line-height:1.7}
</style>
</head>
<body>
<main class="wrap">
<div class="symbol" aria-hidden="true">⚠️</div>
<div class="eyebrow">잠깐!</div>
<h1>방금 그 QR코드,<br>확인하셨나요?</h1>
<p>누가 만들었는지,<br>어디로 연결되는지 알고 누르셨나요?</p>
<div class="line"></div>
<div class="key">믿기 전에, 확인!</div>
<div class="small">개인정보 보호 교육용 모의 체험<br>개인정보 입력을 요구하지 않습니다.</div>
</main>
</body>
</html>
